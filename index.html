<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="robots" content="noindex, nofollow, noarchive, nosnippet">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0a0e14">
  <title>Travel Index｜旅程檔案</title>
  <style>
    :root { --bg:#0a0e14; --panel:#101722; --panel-2:#151f2b; --line:#2a3747; --text:#f1f5f8; --muted:#9ba9b7; --blue:#59bde9; --blue-deep:#103f57; --gold:#f4c85b; --coral:#ff886e; }
    * { box-sizing:border-box; } html { background:var(--bg); }
    body { margin:0; min-width:320px; color:var(--text); background:radial-gradient(circle at 92% -8%,rgba(41,136,178,.22),transparent 34rem),var(--bg); font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif; -webkit-font-smoothing:antialiased; }
    .shell { width:min(1060px,calc(100% - 36px)); margin:auto; padding:24px 0 48px; }
    .masthead { display:flex; align-items:center; justify-content:space-between; gap:16px; padding:0 2px 18px; border-bottom:1px solid var(--line); }
    .brand { display:flex; align-items:center; gap:10px; font-weight:800; letter-spacing:.025em; }.brand-mark { display:grid; place-items:center; width:29px; height:29px; border-radius:9px 9px 9px 2px; background:var(--blue); color:#07131b; transform:rotate(-12deg); }.brand-mark span { transform:rotate(12deg); }
    .archive-label { margin:0; color:var(--muted); font:11px/1.3 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace; letter-spacing:.09em; text-transform:uppercase; }
    .travel-bar { display:grid; grid-template-columns:1fr 310px; min-height:142px; margin:28px 0 42px; overflow:hidden; border:1px solid #314354; border-radius:18px; background:linear-gradient(115deg,#121e2a 0%,#0d151e 68%); }
    .bar-copy { padding:25px 29px; }.bar-eyebrow,.trip-code,.section-count,.footer-note { margin:0; color:var(--blue); font:11px/1.4 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace; letter-spacing:.09em; text-transform:uppercase; }
    .bar-copy h1 { margin:8px 0 5px; font-size:23px; line-height:1.2; letter-spacing:-.03em; }.bar-copy p:last-child { margin:0; color:var(--muted); font-size:14px; }
    .route-art { position:relative; overflow:hidden; border-left:1px solid rgba(106,159,184,.2); background:radial-gradient(circle at 58% 68%,rgba(80,181,225,.13),transparent 44%); }.route-art p { position:absolute; z-index:1; top:20px; right:25px; margin:0; color:#9bb5c3; font:10px/1.55 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace; text-align:right; letter-spacing:.06em; }.route-art svg { position:absolute; inset:0; width:100%; height:100%; }
    .section-head { display:flex; align-items:baseline; justify-content:space-between; gap:16px; margin:0 2px 17px; }.section-head h2 { margin:0; font-size:17px; letter-spacing:-.02em; }.section-count { color:var(--muted); }
    .itinerary-grid { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:16px; }.trip-card { position:relative; min-height:268px; overflow:hidden; padding:24px; border:1px solid #2e647b; border-radius:16px; color:var(--text); background:linear-gradient(135deg,#123f55,#0c2837); text-decoration:none; box-shadow:0 18px 42px rgba(0,0,0,.24); isolation:isolate; transition:transform .2s ease,border-color .2s ease,box-shadow .2s ease; }.trip-card::before { position:absolute; z-index:-1; width:275px; height:275px; right:-82px; bottom:-160px; border:1px solid rgba(144,217,246,.28); border-radius:50%; content:""; box-shadow:0 0 0 29px rgba(94,190,230,.07),0 0 0 58px rgba(94,190,230,.05); }.trip-card::after { position:absolute; z-index:-1; right:30px; top:28px; width:11px; height:11px; border-radius:50%; background:var(--gold); box-shadow:-26px 38px 0 rgba(244,200,91,.8),-55px 70px 0 rgba(244,200,91,.48); content:""; }.trip-card:hover { transform:translateY(-4px); border-color:#66c4e8; box-shadow:0 23px 54px rgba(0,0,0,.34); }.trip-card:focus-visible { outline:3px solid var(--gold); outline-offset:4px; }.trip-code { color:#b6e8fa; font-weight:800; }.trip-card h3 { margin:43px 0 10px; font-family:Georgia,"Noto Serif TC","Songti TC",serif; font-size:39px; line-height:1; letter-spacing:-.05em; font-weight:500; }.trip-detail { margin:0; color:#c3d8e2; font-size:14px; }.trip-cta { position:absolute; left:24px; bottom:23px; display:flex; align-items:center; gap:10px; font-size:14px; font-weight:800; }.trip-cta b { display:grid; width:25px; height:25px; place-items:center; border-radius:50%; color:#0d2a39; background:var(--gold); transition:transform .2s ease; }.trip-card:hover .trip-cta b { transform:translateX(4px); }
    .future-card { min-height:268px; padding:24px; border:1px dashed #3c4d60; border-radius:16px; background:rgba(20,29,40,.62); }.future-icon { display:grid; place-items:center; width:38px; height:38px; border:1px solid #40566b; border-radius:50%; color:var(--blue); font-size:19px; }.future-card h3 { margin:76px 0 8px; font-size:19px; letter-spacing:-.025em; }.future-card p { max-width:280px; margin:0; color:var(--muted); font-size:14px; line-height:1.7; }
    footer { display:flex; justify-content:space-between; gap:16px; margin-top:38px; padding:18px 2px 0; border-top:1px solid var(--line); color:var(--muted); font-size:12px; } footer p { margin:0; }.footer-note { color:#718193; font-size:10px; }
    @media (max-width:680px) { .shell { width:min(100% - 28px,560px); padding-top:17px; }.archive-label { display:none; }.travel-bar { grid-template-columns:1fr 137px; min-height:128px; margin:22px 0 32px; border-radius:14px; }.bar-copy { padding:21px 18px; }.bar-copy h1 { font-size:19px; }.bar-copy p:last-child { font-size:12px; line-height:1.5; }.route-art p { top:17px; right:12px; font-size:8px; }.itinerary-grid { grid-template-columns:1fr; }.trip-card,.future-card { min-height:242px; }.trip-card h3 { margin-top:37px; }.future-card h3 { margin-top:52px; } footer { flex-direction:column; margin-top:30px; } }
    @media (prefers-reduced-motion:reduce) { *,*::before,*::after { transition-duration:.01ms!important; } }
  </style>
</head>
<body>
  <main class="shell">
    <header class="masthead"><div class="brand"><span class="brand-mark" aria-hidden="true"><span>✦</span></span>Travel Index</div><p class="archive-label">Private itinerary archive · 2026 —</p></header>
    <section class="travel-bar" aria-label="旅程入口"><div class="bar-copy"><p class="bar-eyebrow">Your travel archive</p><h1>下一站，從這裡開始。</h1><p>目的地、行程表與出發前的細節。</p></div><div class="route-art" aria-hidden="true"><p>TPE · 25°N<br>READY TO GO</p><svg viewBox="0 0 310 142" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M-8 121C53 118 61 27 147 36C211 43 185 118 324 35" stroke="#59BDE9" stroke-width="2" stroke-dasharray="4 7"/><circle cx="0" cy="121" r="5" fill="#FF886E"/><circle cx="302" cy="42" r="5" fill="#F4C85B"/><path d="M176 57L195 49L187 66L183 61L176 64L180 58L176 57Z" fill="#F4C85B"/></svg></div></section>
    <section aria-labelledby="itineraries-title"><div class="section-head"><h2 id="itineraries-title">旅程檔案</h2><p class="section-count">01 itinerary</p></div><div class="itinerary-grid"><a class="trip-card" href="korea/" aria-label="開啟韓國首爾 2026 行程"><p class="trip-code">KR · SEL / 2026</p><h3>韓國<br>首爾</h3><p class="trip-detail">2026.08.22 — 08.26 · 5 Days</p><span class="trip-cta">查看行程 <b aria-hidden="true">→</b></span></a><article class="future-card" aria-label="下一趟旅程將顯示於此"><div class="future-icon" aria-hidden="true">＋</div><h3>下一趟旅程</h3><p>新增目的地與年份後，它會出現在這裡，成為下一張可開啟的旅程卡。</p></article></div></section>
    <footer><p>每個行程，都值得有一個隨時能回看的入口。</p><p class="footer-note">Travel index / private link</p></footer>
  </main>
</body>
</html>
