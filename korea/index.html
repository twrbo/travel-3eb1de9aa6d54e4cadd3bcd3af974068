<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex, nofollow, noarchive, nosnippet">
  <title>韓國旅程</title>
  <style>
    :root{color-scheme:dark;--bg:#0a0e14;--panel:#101722;--line:#2a3747;--text:#f1f5f8;--muted:#9ba9b7;--blue:#59bde9;--gold:#f4c85b}
    *{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans TC","Microsoft JhengHei",sans-serif}
    main{width:min(760px,calc(100% - 32px));margin:auto;padding:42px 0 60px}a{color:inherit;text-decoration:none}
    nav{margin-bottom:48px;color:var(--muted);font-size:13px}nav a:hover{color:var(--blue)}
    .eyebrow{margin:0 0 8px;color:var(--blue);font:11px ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:.12em;text-transform:uppercase}
    h1{margin:0 0 10px;font-size:38px;letter-spacing:-.04em} .intro{margin:0 0 32px;color:var(--muted);line-height:1.7}
    .years{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px}.year{display:block;padding:24px;border:1px solid var(--line);border-radius:16px;background:linear-gradient(135deg,#123f55,#0c2837);transition:.2s}
    .year:hover{transform:translateY(-3px);border-color:var(--blue)}.year-label{margin:0;color:#b6e8fa;font:11px ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:.1em}.year h2{margin:34px 0 8px;font-size:30px}.year p{margin:0;color:#c3d8e2;font-size:13px}.arrow{float:right;color:var(--gold);font-size:22px}
    @media(max-width:520px){main{padding-top:25px}h1{font-size:32px}}
  </style>
</head>
<body>
  <main>
    <nav><a href="../">← Travel Index</a></nav>
    <p class="eyebrow">Travel archive / Korea</p>
    <h1>韓國旅程</h1>
    <p class="intro">依年份整理的韓國旅行紀錄。</p>
    <section class="years" aria-label="韓國旅行年份">
      <a class="year" href="2026/">
        <span class="arrow" aria-hidden="true">→</span>
        <p class="year-label">KOREA / 2026</p>
        <h2>首爾</h2>
        <p>2026.08.22 — 2026.08.26</p>
      </a>
    </section>
  </main>
</body>
</html>
